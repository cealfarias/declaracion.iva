name: Verificación de desarrollo IVA
on:
  push:
    branches: [feature/sidebar-empresas-invalidados]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: declaraciones_iva_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: declaraciones_iva_web/package-lock.json
      - run: npm ci
      - run: npm run build
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q declaraciones_iva_api
      - name: Verify company route security contracts
        run: python -m unittest discover -s declaraciones_iva_api/tests -p "test_security_contract.py"
